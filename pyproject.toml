[build-system]
requires = ["setuptools>=77.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d810-egglog"
version = "0.1.0"
description = "Optional Egglog e-graph backend for d810-ng"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "d810 contributors" }]
dependencies = [
  "d810-ng>=1.0.0b2",
  "egglog==13.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[project.entry-points."d810.backends"]
egglog = "d810_egglog:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d810_egglog = ["profiles/*.json", "baselines/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
  "runtime: tests that exercise the live runtime",
  "hexrays: tests that require the Hex-Rays runtime",
  "ida_required: tests that require IDA/idalib initialization",
  "profile: tests that collect bounded performance receipts",
]
